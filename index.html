<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080A09" />
    <meta name="description" content="Every receipt, in its cell." />
    <title>Ledgr</title>
    <script>
      // Applied before first paint so the shell never flashes the wrong ground.
      try {
        const stored = localStorage.getItem('ledgr-theme')
        const dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
